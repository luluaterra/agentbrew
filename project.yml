name: LetItBrew

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # The user's Personal Team (read from the signing certificate's OU).
    DEVELOPMENT_TEAM: A7HHMGNNZ2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  LetItBrewAppCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/LetItBrewAppCore
    dependencies:
      - target: LetItBrewCore
    settings:
      base:
        PRODUCT_NAME: LetItBrewAppCore
        PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.app-core
        SKIP_INSTALL: true

  LetItBrewCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/LetItBrewCore
    settings:
      base:
        PRODUCT_NAME: LetItBrewCore
        PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.core
        SKIP_INSTALL: true

  LetItBrewDaemonCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/LetItBrewDaemonCore
    dependencies:
      - target: LetItBrewCore
    settings:
      base:
        PRODUCT_NAME: LetItBrewDaemonCore
        PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.daemon-core
        SKIP_INSTALL: true

  LetItBrew:
    type: application
    platform: macOS
    sources:
      - path: Sources/LetItBrewApp
    info:
      path: Config/AgentBrew-Info.plist
      properties:
        CFBundleDisplayName: "AgentBrew Dev"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_MODULE_NAME: LetItBrew
        EXECUTABLE_NAME: AgentBrew
      configs:
        Debug:
          PRODUCT_NAME: "AgentBrew Dev"
          PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.dev
          LETITBREW_DAEMON_LABEL: com.agentbrew.dev.daemon
          LETITBREW_DAEMON_PLIST: $(SRCROOT)/Config/LaunchDaemons/com.agentbrew.dev.daemon.plist
        Release:
          PRODUCT_NAME: "AgentBrew"
          PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew
          LETITBREW_DAEMON_LABEL: com.agentbrew.daemon
          LETITBREW_DAEMON_PLIST: $(SRCROOT)/Config/LaunchDaemons/com.agentbrew.daemon.plist
    dependencies:
      - target: LetItBrewDaemon
        embed: false
      - target: LetItBrewCLI
        embed: false
      - target: LetItBrewAppCore
      - target: LetItBrewDaemonCore
      - target: LetItBrewCore
    postBuildScripts:
      - name: Embed signed launch daemon, update support, and legal resources
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          services_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchServices"
          plists_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          helpers_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          update_support_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/UpdateSupport"
          legal_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Legal"
          /bin/mkdir -p "$services_dir" "$plists_dir" "$helpers_dir" "$update_support_dir" "$legal_dir"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/AgentBrewDaemon" "$services_dir/AgentBrewDaemon"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/agentbrew" "$helpers_dir/agentbrew"
          /usr/bin/install -m 644 "$LETITBREW_DAEMON_PLIST" "$plists_dir/$LETITBREW_DAEMON_LABEL.plist"
          /usr/bin/install -m 755 "$SRCROOT/scripts/run-update.sh" "$update_support_dir/run-update.sh"
          /usr/bin/install -m 755 "$SRCROOT/scripts/upgrade-installed-app.sh" "$update_support_dir/upgrade-installed-app.sh"
          /usr/bin/install -m 755 "$SRCROOT/scripts/verify-artifact.sh" "$update_support_dir/verify-artifact.sh"
          /usr/bin/install -m 644 "$SRCROOT/scripts/lib-power-baseline.sh" "$update_support_dir/lib-power-baseline.sh"
          /usr/bin/install -m 644 "$SRCROOT/LICENSE" "$legal_dir/LICENSE"
          /usr/bin/install -m 644 "$SRCROOT/NOTICE" "$legal_dir/NOTICE"
          /usr/bin/install -m 644 "$SRCROOT/TRADEMARKS.md" "$legal_dir/TRADEMARKS.md"
          # Files created beneath a file-provider-managed directory can inherit
          # Finder metadata that codesign rejects. Strip metadata before Xcode
          # applies the outer app signature; embedded Mach-O signatures remain.
          /usr/bin/xattr -cr "$TARGET_BUILD_DIR/$WRAPPER_NAME"

  LetItBrewDaemon:
    type: tool
    platform: macOS
    sources:
      - path: Sources/LetItBrewDaemon
    dependencies:
      - target: LetItBrewDaemonCore
      - target: LetItBrewCore
    settings:
      base:
        # A standalone launchd tool does not use an app provisioning profile.
        # Prevent Xcode from injecting get-task-allow/application-identifier.
        # Trust is carried by the Apple-issued code signature and Team ID.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        ENTITLEMENTS_REQUIRED: false
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: AgentBrewDaemon
        SKIP_INSTALL: true
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.dev.daemon
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.daemon

  LetItBrewCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/agentbrew
    dependencies:
      - target: LetItBrewCore
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        ENTITLEMENTS_REQUIRED: false
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: agentbrew
        SKIP_INSTALL: true
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.dev.cli
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.agentbrew.cli

schemes:
  LetItBrew:
    build:
      targets:
        LetItBrew: all
        LetItBrewDaemon: all
        LetItBrewCLI: all
    run:
      config: Debug
    archive:
      config: Release
